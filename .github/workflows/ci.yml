# =============================================================================
# CI : code Python (tests avec AWS simulé) + infrastructure Terraform
# (validation, tests d'architecture simulés, lint, sécurité). Aucun compte
# AWS n'est nécessaire.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.13.5

jobs:
  python:
    name: Code (Ruff + pytest avec moto)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]" "aws-lambda-powertools[tracer]"
      - run: ruff check . && ruff format --check .
      - run: pytest -v

  package:
    name: Paquet Lambda (arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: ./scripts/build.sh
      - name: Le paquet s'importe-t-il ? (test sur la plateforme cible arm64)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD/build:/var/task" \
            -e INVOICES_TABLE=t -e IDEMPOTENCY_TABLE=i -e EVENT_BUS_NAME=b -e UPLOAD_BUCKET=u \
            -e AWS_DEFAULT_REGION=eu-west-3 -e POWERTOOLS_TRACE_DISABLED=1 \
            --entrypoint python public.ecr.aws/lambda/python:3.13-arm64 \
            -c "import sys; sys.path.insert(0,'/var/task'); import invoices.processor, invoices.api; print('imports OK')"
        continue-on-error: true  # l'émulation arm64 (QEMU) peut manquer sur certains runners
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-package
          path: build/

  terraform:
    name: Terraform (validate, tests, TFLint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Tests d'architecture (AWS simulé)
        run: terraform test -verbose
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init && tflint --format compact

  security:
    name: Sécurité (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install checkov
      - run: checkov -d infra --config-file .checkov.yaml -o cli -o sarif --output-file-path console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && github.event_name == 'push' && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov
