# Déploiement MANUEL sur AWS (Actions > Deploy > Run workflow), via OIDC.
# Prérequis : variable AWS_DEPLOY_ROLE_ARN (rôle à créer comme dans le projet
# aws-landing-zone-terraform) et environnement GitHub « production » protégé.
name: Deploy

on:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: ./scripts/build.sh
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3
      - name: terraform apply
        working-directory: infra
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="region=eu-west-3"
          terraform apply -input=false -auto-approve
