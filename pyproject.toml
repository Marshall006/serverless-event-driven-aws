[project]
name = "invoice-pipeline"
version = "1.0.0"
description = "Traitement événementiel de factures sur AWS (S3, EventBridge, SQS, Lambda, DynamoDB)."
requires-python = ">=3.13"
license = "MIT"
dependencies = ["aws-lambda-powertools[tracer]>=3.0"]

[project.optional-dependencies]
dev = ["boto3", "moto[s3,sqs,dynamodb,events]>=5", "pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
