# Exclusions Checkov : chaque contrôle écarté est une décision documentée
# (voir aussi docs/adr/). Contexte : charge modérée, budget maîtrisé.
framework: terraform
compact: true
skip-check:
  # Concurrence réservée par fonction : sur un compte neuf (quota de 10
  # exécutions simultanées), toute réservation échoue. La concurrence est
  # plafonnée par l'event source mapping (maximum_concurrency) et la limitation
  # de débit de l'API.
  - CKV_AWS_115
  # DLQ au niveau de la Lambda : non pertinent. Le processeur est déclenché par
  # SQS (la DLQ est sur la file) et l'API est synchrone (l'erreur revient à
  # l'appelant).
  - CKV_AWS_116
  # Lambda dans un VPC : aucune ressource privée à joindre ; un VPC imposerait
  # des endpoints ou une NAT Gateway (~33 $/mois) sans gain de sécurité ici.
  - CKV_AWS_117
  # Signature de code Lambda (AWS Signer) : amélioration possible ; le paquet
  # est construit uniquement par la CI à partir de dépendances verrouillées.
  - CKV_AWS_272
  # Chiffrement KMS des variables d'environnement : elles ne contiennent aucun
  # secret (noms de tables, seuils) ; chiffrement AWS par défaut.
  - CKV_AWS_173
  # DynamoDB avec clé KMS gérée par le client : chiffrement AWS déjà actif ;
  # une CMK coûte ~1 $/mois/clé + appels, sans exigence réglementaire ici.
  - CKV_AWS_119
  # S3 : journalisation des accès, réplication inter-régions, KMS : coût et
  # complexité non justifiés pour des fichiers éphémères (expirés à 1 an) ;
  # bucket privé, chiffré, TLS obligatoire, versionné.
  - CKV_AWS_18
  - CKV_AWS_144
  - CKV_AWS_145
  # Journaux CloudWatch : rétention 14 jours et chiffrement par défaut d'AWS,
  # suffisants pour l'exploitation (1 an + KMS multiplierait le coût).
  - CKV_AWS_338
  - CKV_AWS_158
